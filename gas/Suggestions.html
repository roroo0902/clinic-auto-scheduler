<style>
#suggestion-dialog{box-sizing:border-box;width:min(1150px,96vw);max-height:92dvh;padding:24px;border:1px solid #b6a17b;border-radius:14px;background:#f7f6f2;color:#243b50;font:16px/1.6 system-ui}#suggestion-dialog::backdrop{background:#071525bb}#suggestion-dialog button,#suggestion-dialog input,#suggestion-dialog select{font:inherit;min-height:44px;padding:8px 12px;border:1px solid #9aabb9;border-radius:7px;background:white;color:#243b50}#suggestion-dialog button:disabled{opacity:.5}#suggestion-dialog .sg-tools{display:flex;gap:12px;align-items:end;flex-wrap:wrap}#suggestion-dialog label{display:flex;flex-direction:column;gap:6px}#suggestion-dialog .sg-scroll{overflow:auto;max-height:50vh;margin:16px 0}#suggestion-dialog table{border-collapse:separate;border-spacing:0;width:100%;background:#fff}#suggestion-dialog th,#suggestion-dialog td{padding:8px;border:1px solid #d9e0e5;white-space:nowrap;text-align:center}#suggestion-dialog th{background:#e3edf2;position:sticky;top:0}#suggestion-dialog td:first-child,#suggestion-dialog th:first-child{position:sticky;left:0;background:#e3edf2}#suggestion-dialog .sg-changed{background:#fff0bd}#suggestion-dialog details{margin:12px 0;padding:10px;border:1px solid #ced7df}#suggestion-dialog .sg-confirm{flex-direction:row;align-items:center}#sg-status{white-space:pre-wrap}#sg-open{margin:10px} @media(max-width:600px){#suggestion-dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;padding:16px;border-radius:0}#suggestion-dialog .sg-tools{display:grid;grid-template-columns:1fr}#suggestion-dialog input,#suggestion-dialog select{max-width:100%;box-sizing:border-box}#sg-open{min-height:48px}}
</style>
<dialog id="suggestion-dialog" aria-labelledby="sg-title"><button id="sg-close" style="float:right" aria-label="關閉智慧排班">×</button><h2 id="sg-title">管理者：智慧排班建議</h2><p>依 Google Sheet 參數產生建議。先預覽、確認後才更新正式班表；套用前會自動備份。</p><div class="sg-tools"><label>排班月份（沿用目前班表）<input id="sg-month" type="text" readonly aria-describedby="sg-month-help"></label><label>建議方式<select id="sg-mode"><option value="fill">保留既有班次，再補齊人力</option><option value="rebuild">重新建議整月（保留鎖定／指定班次）</option></select></label><button id="sg-generate">檢查參數並產生建議</button></div><p id="sg-month-help">要更換月份，請先關閉此視窗，使用班表上方的年月滾輪。</p><p id="sg-status" role="status" aria-live="polite"></p><div id="sg-result"></div><div id="sg-approval" hidden><label class="sg-confirm"><input id="sg-confirm" type="checkbox">我已確認變更及工時，將套用到正式班表</label><button id="sg-apply" disabled>確認套用建議班表</button></div></dialog>
<script>
(()=>{
 const $=id=>document.getElementById(id),dialog=$('suggestion-dialog'),result=$('sg-result'),status=$('sg-status');let draft=null,busy=false,seq=0;
 const el=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;};
 function invalidate(){seq++;draft=null;result.replaceChildren();$('sg-confirm').checked=false;$('sg-approval').hidden=true;$('sg-apply').disabled=true;status.textContent='';}
 $('sg-month').onchange=invalidate;$('sg-mode').onchange=invalidate;
 $('sg-close').onclick=()=>{if(!busy)dialog.close();};dialog.addEventListener('cancel',e=>{if(busy)e.preventDefault();});
 function controls(locked){busy=locked;for(const id of ['sg-month','sg-mode','sg-generate','sg-close'])$(id).disabled=locked;}
 const sheets={'每日班別人力需求':170272222,'日曆設定':1017486508,'允許班別組合':26010003,'班別時間設定':766929081,'員工基本資料':1543443974,'月班表':26112601};
 function render(data){
  draft=data;result.replaceChildren();$('sg-approval').hidden=!data.canApply;$('sg-confirm').checked=false;$('sg-apply').disabled=true;
  status.textContent=data.ready?(data.canApply?'建議已通過檢查，請檢視黃色變更格後確認。建議有效 20 分鐘。':'已產生待調整建議；尚有缺額、衝突或未完成檢查，目前不可套用。'):'參數尚未齊全，請完成下列項目後重新產生。';
  for(const title of ['issues','warnings']){const grouped={};for(const x of data[title]||[])(grouped[x.sheet||'說明']??=[]).push(x.message);
   for(const [sheet,messages] of Object.entries(grouped)){const detail=el('details'),summary=el('summary',(title==='issues'?'待處理：':'提醒：')+sheet+'（'+messages.length+' 項）');detail.append(summary);if(sheets[sheet]){const a=el('a','開啟「'+sheet+'」');a.href='https://docs.google.com/spreadsheets/d/1yXezGllA3WtarKxIpWrVJmObqizbhnBAjub8cFMATiQ/edit#gid='+sheets[sheet];a.target='_blank';a.rel='noopener';detail.append(a);}const list=el('ul');messages.forEach(m=>list.append(el('li',m)));detail.append(list);result.append(detail);}
  }
  if(!data.employees?.length)return;
  result.append(el('p','黃色＝與正式班表不同；每格顯示「原班別 → 建議班別」。空白顯示「未排」，不代表已核准休假。'));
  const wrap=el('div');wrap.className='sg-scroll';const table=el('table'),head=el('tr');['員工','工時／目標','變更天數',...data.employees[0].days.map((_,i)=>{const d=new Date(data.month+'-'+String(i+1).padStart(2,'0')+'T00:00:00Z');return (i+1)+'（'+'日一二三四五六'[d.getUTCDay()]+'）';})].forEach(v=>head.append(el('th',v)));const thead=el('thead');thead.append(head);table.append(thead);const body=el('tbody');for(const e of data.employees){const row=el('tr');[e.name,e.hours+'／'+(e.targetHours??'未設定'),e.changedDays].forEach(v=>row.append(el('td',v)));e.days.forEach((s,i)=>{const change=s!==e.before[i],c=el('td',change?(e.before[i]||'未排')+' → '+(s||'未排'):(s||'未排'));if(change)c.className='sg-changed';row.append(c);});body.append(row);}table.append(body);wrap.append(table);result.append(wrap);
  const detail=el('details');detail.append(el('summary','每日人力核對（已排／最低／理想／最高）'));const list=el('ul');data.coverage.forEach(c=>list.append(el('li',c.date+' '+c.shift+'：'+[c.actual,c.min,c.ideal,c.max].join('／')+(c.shortage?'，缺 '+c.shortage+' 人':''))));detail.append(list);result.append(detail);
 }
 $('sg-generate').onclick=()=>{if(busy)return;invalidate();const run=seq;controls(true);status.textContent='正在讀取 Sheet 並檢查參數…';google.script.run.withFailureHandler(e=>{controls(false);status.textContent=e.message||'產生失敗，請稍後重試。';}).withSuccessHandler(data=>{controls(false);if(run!==seq)return;try{render(data);}catch(_){invalidate();status.textContent='建議畫面未完整顯示，請重新產生；正式班表未變更。';}}).previewScheduleSuggestion({month:$('sg-month').value,mode:$('sg-mode').value});};
 $('sg-confirm').onchange=()=>{$('sg-apply').disabled=!$('sg-confirm').checked||!draft?.canApply||busy;};
 $('sg-apply').onclick=()=>{if(busy||!draft?.token||!$('sg-confirm').checked)return;const token=draft.token;draft=null;controls(true);$('sg-apply').disabled=true;$('sg-approval').hidden=true;status.textContent='正在重新核對參數、建立備份並套用，請勿重複送出…';google.script.run.withFailureHandler(e=>{controls(false);status.textContent=(e.message||'結果未確認。')+'\n請關閉此視窗並重新讀取正式班表後確認。';}).withSuccessHandler(r=>{controls(false);result.replaceChildren();status.textContent='已套用並讀回核對成功。套用前備份：'+r.backupSheet+'。\n關閉此視窗後，請按班表的「重新讀取」查看最新內容。';}).applyScheduleSuggestion({token,confirmed:true});};
 google.script.run.withFailureHandler(()=>{}).withSuccessHandler(m=>{if(m.role!=='管理者')return;const host=document.querySelector('#schedule-dialog .schedule-navigation')||document.querySelector('#schedule-dialog');if(!host)return;const button=el('button','智慧排班建議');button.id='sg-open';button.type='button';button.onclick=()=>{invalidate();$('sg-month').value=document.getElementById('schedule-month')?.value||new Date().toISOString().slice(0,7);dialog.showModal();};host.append(button);}).getCurrentMember();
})();
</script>
