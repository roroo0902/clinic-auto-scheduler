<style>
#auto-schedule{width:min(1100px,96vw);max-height:92vh;overflow:auto;background:#172333;color:#f5eedf;border:1px solid #ac9161;border-radius:14px;padding:22px;font:16px/1.65 system-ui}#auto-schedule::backdrop{background:#000a}#auto-schedule button,#auto-schedule input,#auto-schedule select{font:inherit;padding:9px;border-radius:7px}#auto-schedule button{cursor:pointer}#auto-schedule button:disabled{opacity:.45;cursor:wait}#auto-schedule a{color:#a9d8ff}#auto-schedule label{display:block;margin:10px 0}#auto-schedule table{border-collapse:collapse;min-width:650px}#auto-schedule th,#auto-schedule td{border:1px solid #677487;padding:5px;white-space:nowrap}#auto-schedule .auto-scroll{overflow:auto;max-height:400px}#auto-schedule .auto-actions{display:flex;gap:10px;flex-wrap:wrap}#auto-launch{position:fixed;bottom:18px;right:18px;z-index:90;background:#e3c58e;color:#142033;padding:12px 20px;border:1px solid #99804e;border-radius:24px;font:600 16px system-ui}#auto-message,#auto-demand-message{white-space:pre-line}#auto-schedule [hidden]{display:none!important}#auto-demand-review{border:1px solid #677487;border-radius:7px;margin:12px 0;padding:0 12px 12px}.auto-note{color:#e7cc93}
</style>
<button id="auto-launch" hidden>自動排班</button>
<dialog id="auto-schedule" aria-labelledby="auto-title">
 <div class="auto-actions"><h2 id="auto-title">自動排班與同步</h2><button id="auto-close" style="margin-left:auto">關閉</button></div>
 <p>先檢查資料，再產生整月預覽。缺少的人數保持待填；不會以零代替。通過全部已輸入的硬限制，並經管理者確認後才寫入 Google Sheet。</p>
 <label>排班月份 <input id="auto-month" type="month"></label>
 <label>資料模式 <select id="auto-mode"><option value="production">正式資料</option><option value="acceptance">獨立驗收：17 位虛構人員</option></select></label>
 <p class="auto-note" id="auto-mode-note">正式發布會建立班表備份，並同步月班表、排班明細及版本紀錄。人力需求差異須另行覆核，只有選擇採用的項目才會一併套用。</p>
 <label><input id="auto-reviewed" type="checkbox"> 我已覆核輸入；未填的選填規則本次不啟用。此檢查不代表法規合規認證，結果仍須人工覆核。</label>
 <div class="auto-actions"><button id="auto-check">檢查缺漏</button><button id="auto-preview">產生排班預覽</button><a id="auto-fill" hidden target="_blank" rel="noopener">填寫所選月份人力需求</a></div>
 <section id="auto-demand-review" aria-labelledby="auto-demand-title"><h3 id="auto-demand-title">覆核本月人力需求待填差異</h3><p>比對正式值與待填值後，可保留正式設定，或明確選擇採用的項目。讀取與覆核不寫入試算表。</p><button id="auto-demand-read" type="button">讀取人力需求差異</button><p id="auto-demand-message" role="status" aria-live="polite"></p><div id="auto-demand-rows" class="auto-scroll"></div><div id="auto-demand-actions" class="auto-actions" hidden><button id="auto-demand-baseline" type="button">全部保留正式值</button><button id="auto-demand-apply" type="button" disabled>覆核並採用勾選項目</button></div></section>
 <p id="auto-message" role="status" aria-live="polite"></p><div id="auto-results"></div>
 <div id="auto-confirm-area" hidden><label><input id="auto-confirm" type="checkbox"> 我已查看每位人員及日期，確認將這份預覽寫入指定工作表。</label><button id="auto-publish" disabled>確認寫入 Google Sheet</button></div>
</dialog>
<script>
(()=>{
const $=id=>document.getElementById(id),dialog=$('auto-schedule');let busy=null,draft=null,seq=0,review=null,reviewDecision=null,monthChosen=false;const selectedDemandIds=new Set();
const node=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;};
const invalidate=()=>{seq++;draft=null;$('auto-confirm-area').hidden=true;$('auto-confirm').checked=false;$('auto-publish').disabled=true;};
const setBusy=phase=>{busy=phase;for(const id of ['auto-month','auto-mode','auto-check','auto-preview','auto-reviewed','auto-demand-read'])$(id).disabled=Boolean(phase);$('auto-close').disabled=phase==='write';$('auto-publish').disabled=Boolean(phase)||!draft||!$('auto-confirm').checked;setDemandControls();};
function setDemandControls(){
 $('auto-demand-baseline').disabled=Boolean(busy)||!review?.requiresReview;
 $('auto-demand-apply').disabled=Boolean(busy)||!review?.requiresReview||!selectedDemandIds.size;
 for(const item of $('auto-demand-rows').querySelectorAll('[data-demand-choice]'))item.disabled=Boolean(busy);
}
function resetDemandReview(){
 review=null;reviewDecision=null;selectedDemandIds.clear();$('auto-demand-rows').replaceChildren();$('auto-demand-actions').hidden=true;$('auto-demand-message').textContent='';$('auto-demand-review').hidden=$('auto-mode').value!=='production';setDemandControls();
}
function demandSummary(value){
 if(!value)return '未能核對';
 const qty=n=>n===''||n==null?'未填':String(n);
 const status=value.closed===true?'休診':value.closed===false?'開診':'待確認';
 return status+'｜最低 '+qty(value.min)+'／理想 '+qty(value.ideal)+'／最高 '+qty(value.max);
}
function showDemandReview(result){
 review=result;
 if(!result.requiresReview){$('auto-demand-message').textContent='未發現需要覆核的人力需求差異。';return;}
 $('auto-demand-message').textContent='待填差異共 '+result.rows.length+' 筆。請明確選擇保留正式值，或勾選要採用的差異。未勾選一律保留正式值。';
 const table=node('table'),head=node('tr');['日期／班別','正式設定','待填設定','覆核狀態'].forEach(t=>head.append(node('th',t)));table.append(head);
 for(const row of result.rows){
  const tr=node('tr');tr.append(node('td',String(row.date||'日期不明')+' '+String(row.shift||'班別不明')),node('td',demandSummary(row.official)),node('td',demandSummary(row.proposed)));
  const cell=node('td');
  if(row.eligible===true){
   const label=node('label'),input=node('input');input.type='checkbox';input.dataset.demandChoice='';
   input.onchange=()=>{if(busy)return;if(input.checked)selectedDemandIds.add(row.id);else selectedDemandIds.delete(row.id);reviewDecision=null;invalidate();$('auto-demand-message').textContent='已變更勾選；請重新確認採用或保留正式值。';setDemandControls();};
   label.append(input,node('span',' 採用 '+String(row.date)+' '+String(row.shift)));cell.append(label);
  }
  if(row.reason||!row.eligible)cell.append(node('span',row.reason||'無法安全採用，保留正式值。'));
  tr.append(cell);table.append(tr);
 }
 $('auto-demand-rows').replaceChildren(table);$('auto-demand-actions').hidden=false;setDemandControls();
}
function chooseDemand(action){
 if(busy||!review?.requiresReview||action==='apply'&&!selectedDemandIds.size)return;
 invalidate();const selectedIds=action==='apply'?[...selectedDemandIds].sort():[];
 reviewDecision={token:review.token,fingerprint:review.fingerprint,action,selectedIds};
 $('auto-demand-message').textContent=action==='baseline'?'已確認全部保留正式值，可重新檢查或產生排班預覽。':'已覆核採用 '+selectedIds.length+' 筆候選差異。只有最後確認發布，才會更新正式試算表。';
}
function loadDemandReview(){
 if(busy||$('auto-mode').value!=='production')return;
 invalidate();resetDemandReview();const thisSeq=seq;setBusy('read');$('auto-demand-message').textContent='正在比對人力需求…可先關閉視窗，不會寫入班表。';
 google.script.run.withSuccessHandler(result=>{if(thisSeq!==seq)return;setBusy(null);if(result?.month!==$('auto-month').value||!Array.isArray(result.rows)||result.requiresReview&&(!result.token||!result.fingerprint)){$('auto-demand-message').textContent='無法核對本月差異，請重新讀取。';return;}showDemandReview(result);}).withFailureHandler(error=>{if(thisSeq!==seq)return;setBusy(null);$('auto-demand-message').textContent=error?.message||String(error);}).getAutoDemandReview({month:$('auto-month').value});
}
$('auto-demand-read').onclick=loadDemandReview;$('auto-demand-baseline').onclick=()=>chooseDemand('baseline');$('auto-demand-apply').onclick=()=>chooseDemand('apply');
let demandLinkSeq=0;
function refreshDemandLink(){
 const seq=++demandLinkSeq,link=$('auto-fill'),month=$('auto-month').value;
 link.hidden=true;link.removeAttribute('href');link.textContent='填寫 '+month+' 人力需求';
 if($('auto-mode').value!=='production'||!/^\d{4}-(0[1-9]|1[0-2])$/.test(month))return;
 google.script.run.withSuccessHandler(result=>{if(seq!==demandLinkSeq)return;if(result?.url){link.href=result.url;link.hidden=false;}}).withFailureHandler(()=>{if(seq===demandLinkSeq){link.hidden=true;link.removeAttribute('href');}}).getAutoDemandSheetLink({month});
}
const fail=error=>{invalidate();setBusy(null);$('auto-message').textContent=error?.message||String(error);};
const names={Employees:'員工基本資料',ShiftDefinitions:'班別時間設定',CalendarDates:'日曆設定',DailyShiftDemands:'每日人力需求',CrossMonthCoverage:'跨月資料完整性',EmployeeSettingsHistory:'員工設定歷程'};
function render(result){
 $('auto-results').replaceChildren();$('auto-message').textContent=result.status==='READY'?'排班預覽已完成；尚未寫入 Sheet。':result.status==='CHECKED'?'輸入檢查通過，可產生預覽。':result.status==='NEEDS_INPUT'?'資料仍有 '+result.issueCount+' 項待確認，其中人力需求 '+result.missingDemandCount+' 筆待填。未寫入任何班表。':'尚未找到通過全部硬限制的方案。未寫入任何班表。';
 if(result.mode==='acceptance')$('auto-results').append(node('p','驗收資料：17 位虛構人員，僅寫入「自動排班驗收」，不會修改正式班表或人力需求。'));
 for(const warning of result.warnings||[])$('auto-results').append(node('p',warning));
 if(result.issues?.length){const list=node('ul');for(const issue of result.issues)list.append(node('li',(names[issue.sheet]||issue.sheet)+(issue.row?' 第 '+issue.row+' 列':'')+'：'+issue.message));$('auto-results').append(list);}
 if(result.plan){
  const wrap=node('div');wrap.className='auto-scroll';const table=node('table'),head=node('tr');['人員','總工時','出勤天數','目標差額',...Array.from({length:result.dayCount},(_,i)=>String(i+1))].forEach(t=>head.append(node('th',t)));table.append(head);
  for(const e of result.validation.stats){const tr=node('tr');tr.dataset.employee=e.id;[e.name,e.hours,e.workDays,e.hourDifference===null?'未設定':e.hourDifference,...Object.keys(result.plan[e.id]).sort().map(d=>result.plan[e.id][d]||'休')].forEach(v=>tr.append(node('td',v)));table.append(tr);}wrap.append(table);$('auto-results').append(wrap);
  $('auto-results').append(node('p','已驗證 '+result.employeeCount+' 人、'+result.dayCount+' 天。預覽有效 20 分鐘；Sheet 有變動須重新產生。'));
  draft=result;$('auto-confirm-area').hidden=false;
 }
}
function preview(checkOnly){if(busy)return;if($('auto-mode').value==='production'&&review?.requiresReview&&!reviewDecision){$('auto-message').textContent='請先明確覆核人力需求差異：保留正式值或採用勾選項目。';return;}if(!checkOnly&&!$('auto-reviewed').checked){$('auto-message').textContent='請先勾選輸入覆核確認。';return;}invalidate();const thisSeq=seq;setBusy('read');$('auto-results').replaceChildren();$('auto-message').textContent=checkOnly?'正在讀取 Google Sheet 與檢查缺漏…可先關閉視窗，不會寫入班表。':'正在搜尋排班方案並逐項驗證…可先關閉視窗，不會寫入班表。';google.script.run.withSuccessHandler(result=>{if(thisSeq!==seq)return;setBusy(null);render(result);}).withFailureHandler(error=>{if(thisSeq===seq)fail(error);}).previewAutoSchedule({month:$('auto-month').value,mode:$('auto-mode').value,checkOnly,reviewedInputs:$('auto-reviewed').checked,...($('auto-mode').value==='production'&&reviewDecision?{demandReview:reviewDecision}:{})});}
$('auto-check').onclick=()=>preview(true);$('auto-preview').onclick=()=>preview(false);
$('auto-confirm').onchange=()=>{$('auto-publish').disabled=busy||!draft||!$('auto-confirm').checked;};
$('auto-publish').onclick=()=>{if(busy||!draft||!$('auto-confirm').checked)return;const token=draft.token;setBusy('write');$('auto-message').textContent='正在重新檢查輸入、備份、寫入與讀回核對…';google.script.run.withSuccessHandler(r=>{invalidate();setBusy(null);$('auto-message').textContent='已寫入並讀回核對成功：'+r.employeeCount+' 人，總工時 '+r.hours+' 小時。版本 '+r.version;const a=node('a','開啟已同步的 Google Sheet');a.href=r.sheetUrl;a.target='_blank';a.rel='noopener';$('auto-results').prepend(a);}).withFailureHandler(fail).publishAutoSchedule({token,confirmed:true});};
$('auto-mode').onchange=()=>{invalidate();resetDemandReview();$('auto-reviewed').checked=false;$('auto-results').replaceChildren();$('auto-message').textContent='';refreshDemandLink();$('auto-mode-note').textContent=$('auto-mode').value==='acceptance'?'只使用明確標示的虛構測試條件，結果寫入獨立驗收分頁。':'正式發布會建立班表備份，並同步月班表、排班明細及版本紀錄。人力需求差異須另行覆核，只有選擇採用的項目才會一併套用。';};
function changeAutoMonth(){invalidate();resetDemandReview();$('auto-reviewed').checked=false;$('auto-results').replaceChildren();$('auto-message').textContent='';refreshDemandLink();}
$('auto-month').onchange=()=>{monthChosen=true;changeAutoMonth();};$('auto-reviewed').onchange=invalidate;
function leaveRead(){if(busy!=='read')return;invalidate();setBusy(null);$('auto-results').replaceChildren();if(!review)$('auto-demand-message').textContent='';$('auto-message').textContent='已離開等待畫面；原檢查或搜尋可能仍在背景完成，不會寫入班表。可重新檢查或產生預覽。';}
function initialAutoMonth(){
 const applied=typeof scheduleAppliedMonth==='undefined'?null:scheduleAppliedMonth,loaded=typeof scheduleData==='undefined'?null:scheduleData?.month;
 for(const month of [applied,loaded])if(typeof month==='string'&&/^\d{4}-(0[1-9]|1[0-2])$/.test(month))return month;
 const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',calendar:'gregory',year:'numeric',month:'2-digit'}).formatToParts(new Date());
 return parts.find(p=>p.type==='year').value+'-'+parts.find(p=>p.type==='month').value;
}
resetDemandReview();$('auto-launch').onclick=()=>{if(!monthChosen){const month=initialAutoMonth();if($('auto-month').value!==month){$('auto-month').value=month;changeAutoMonth();}}dialog.showModal();};$('auto-close').onclick=()=>{if(busy==='write')return;leaveRead();dialog.close();};dialog.addEventListener('cancel',e=>{e.preventDefault();$('auto-close').onclick();});
const wheelPanel = document.getElementById('panel');
if (wheelPanel) {
  const menuLaunch = document.createElement('button');
  menuLaunch.type = 'button';
  menuLaunch.textContent = '自動排班';
  menuLaunch.addEventListener('click', () => {
    $('auto-launch').click();
    if (dialog.open) {
      dialog.addEventListener('close', () => menuLaunch.focus(), {once:true});
    }
  });
  function syncWheelLaunch() {
    const inWheel = wheelPanel.open && wheelPanel.querySelector('h2')?.textContent.trim() === '啟動命運之輪';
    if (inWheel && !$('auto-launch').hidden) {
      if (menuLaunch.parentElement !== wheelPanel) wheelPanel.append(menuLaunch);
    } else {
      menuLaunch.remove();
    }
  }
  new MutationObserver(syncWheelLaunch).observe(wheelPanel, {attributes:true,attributeFilter:['open'],childList:true,subtree:true,characterData:true});
  new MutationObserver(syncWheelLaunch).observe($('auto-launch'), {attributes:true,attributeFilter:['hidden']});
  syncWheelLaunch();
}
google.script.run.withSuccessHandler(m=>{$('auto-launch').hidden=m.role!=='管理者';}).withFailureHandler(()=>{}).getCurrentMember();
})();
</script>
