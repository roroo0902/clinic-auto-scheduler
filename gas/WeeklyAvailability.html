<style>
#wa-dialog{width:min(1200px,96vw);max-width:96vw;max-height:94dvh;box-sizing:border-box;overflow:auto;background:#f8f7f3;color:#18334c;border:1px solid #cbb17d;border-radius:18px;padding:24px;font:16px/1.6 system-ui;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}#wa-dialog::backdrop{background:#08111ccc}#wa-dialog h2{color:#17334d;font-size:28px;margin:12px 0}#wa-dialog h3{color:#17334d;margin:10px 0}#wa-dialog button,#wa-dialog select,#wa-dialog input{font:inherit;box-sizing:border-box}#wa-dialog button{min-height:44px;border:1px solid #a6b4c1;border-radius:8px;background:white;color:#17334d;padding:8px 16px;cursor:pointer;touch-action:manipulation}#wa-dialog button:disabled{opacity:.5;cursor:wait}#wa-dialog .wa-primary{background:#15395d;color:white}#wa-dialog .wa-nav{position:sticky;top:-24px;z-index:5;background:#f8f7f3;padding:12px 0;display:flex;justify-content:space-between;gap:12px}#wa-dialog .wa-controls{display:flex;flex-wrap:wrap;align-items:end;gap:14px;margin:18px 0}#wa-dialog label span{display:block}#wa-dialog select,#wa-dialog input[type=month],#wa-dialog input[type=date]{min-height:48px;background:white;border:1px solid #a6b4c1;border-radius:8px;color:#17334d;padding:8px;max-width:100%}#wa-dialog input[type=checkbox]{width:24px;height:24px;accent-color:#214e78;margin:0;flex-shrink:0}#wa-dialog .wa-scroll{overflow-x:auto;border:1px solid #d1dae0;border-radius:10px;background:white}#wa-dialog table{width:100%;border-collapse:collapse;min-width:680px}#wa-dialog th,#wa-dialog td{padding:12px 8px;text-align:center;border:1px solid #dbe1e5;white-space:normal}#wa-dialog th{background:#edf2f6}#wa-dialog td label{display:flex;align-items:center;justify-content:center;min-height:44px;cursor:pointer}#wa-dialog td:has(input:checked){background:#e3f0ff}#wa-dialog th:first-child{position:sticky;left:0;z-index:1;min-width:100px}#wa-dialog small{display:block;font-size:13px}#wa-dialog .wa-box{background:white;border:1px solid #d6dce2;border-radius:10px;padding:16px;margin:16px 0}#wa-dialog .wa-row{display:flex;align-items:center;flex-wrap:wrap;gap:12px}#wa-dialog .wa-check{display:flex;gap:9px;align-items:center;min-height:44px}#wa-dialog .wa-status{white-space:pre-wrap;padding:12px;background:#eaf2f9;border-left:3px solid #bf9d58}#wa-dialog .wa-footer{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:20px;padding:14px;background:#fff6df;border-radius:10px}#wa-dialog .wa-danger{border:2px solid #c38e35;background:#fff6df}#wa-dialog :focus-visible{outline:3px solid #bf9d58;outline-offset:3px}
@media(max-width:650px){#wa-dialog{width:calc(100vw - 12px);max-width:calc(100vw - 12px);max-height:calc(100dvh - 12px);padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));border-radius:12px}#wa-dialog .wa-nav{top:-14px}#wa-dialog h2{font-size:24px}#wa-dialog .wa-controls>label{flex:1 1 130px;min-width:0}#wa-dialog .wa-controls select,#wa-dialog .wa-controls input{width:100%}#wa-dialog .wa-footer button{flex:1 1 130px}#wa-dialog table{min-width:620px}#wa-dialog .wa-box{padding:12px}#wa-dialog .wa-scroll{max-width:100%}}
</style>
<dialog id="wa-dialog" aria-labelledby="wa-title">
 <div class="wa-nav"><button id="wa-back" type="button">← 上一頁</button><button id="wa-close" type="button" aria-label="關閉可上班設定">×</button></div>
 <h2 id="wa-title">每週固定可上班時段</h2><p>設定一週，所選月份的每一週照此安排；特殊日期另外設定。</p>
 <p id="wa-status" class="wa-status" role="status">正在讀取…</p><div id="wa-body"></div>
</dialog>
<script>
(()=>{
 const dialog=document.getElementById('wa-dialog'),body=document.getElementById('wa-body'),status=document.getElementById('wa-status'),back=document.getElementById('wa-back'),close=document.getElementById('wa-close');
 const weekdays=['一','二','三','四','五','六','日'],shiftNames=['早班','午班','晚班'],times=['08:00–12:00','14:30–18:30','18:30–21:30'];
 let data=null,person='',month=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'}).slice(0,7),draft=null,busy=false,dirty=false,preview=null,parent=null,seq=0;
 const el=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;};
 const btn=(text,fn,primary)=>{const b=el('button',text);b.type='button';if(primary)b.className='wa-primary';b.onclick=fn;return b;};
 const label=(text,input)=>{const l=el('label');l.append(el('span',text),input);return l;};
 const rpc=(method,input)=>new Promise((resolve,reject)=>{const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);if(method==='read')r.getWeeklyAvailability(input);else if(method==='preview')r.previewWeeklyAvailability(input);else r.applyWeeklyAvailability(input);});
 function lock(v){busy=v;dialog.querySelectorAll('button,input,select').forEach(e=>e.disabled=v);}
 function changed(){dirty=true;preview=null;status.textContent='尚未儲存：確認預覽後才寫入 Google Sheet。';}
 function leave(){if(busy)return;if(preview){preview=null;render();return;}if(dirty){guard(()=>{dirty=false;dialog.close();if(parent&&!parent.open)parent.showModal();});return;}dialog.close();if(parent&&!parent.open)parent.showModal();}
 function guard(fn){if(body.querySelector('.wa-discard'))return;const box=el('section');box.className='wa-box wa-danger wa-discard';box.setAttribute('role','alert');box.append(el('p','尚有未儲存的修改。要捨棄修改嗎？'),btn('繼續編輯',()=>box.remove()),btn('捨棄修改',()=>{box.remove();dirty=false;fn();}));body.prepend(box);box.querySelector('button').focus();}
 back.onclick=leave;close.onclick=leave;dialog.addEventListener('cancel',e=>{e.preventDefault();leave();});window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue='';}});
 async function load(){const gen=++seq;lock(true);status.textContent='正在確認權限並讀取設定…';try{const next=await rpc('read',{month});if(gen!==seq)return;data=next;if(!data.employees.some(e=>e.id===person))person=data.employees[0]?.id||'';selectPerson();status.textContent='資料已讀取。只更新可排班規則，不會更動正式班表。';}catch(e){status.textContent=e.message||'讀取失敗';body.replaceChildren(btn('重新讀取',load));}finally{lock(false);}}
 function selectPerson(){const rows=data.weekly.filter(r=>r.employeeId===person);draft={weekly:Array.from({length:7},(_,i)=>rows.find(r=>r.weekday===i+1)?.shifts.slice()||[false,false,false]),exceptions:data.exceptions.filter(r=>r.employeeId===person).map(r=>({date:r.date,shifts:r.shifts.slice()})),configured:rows.length===7};dirty=false;preview=null;render();}
 function summary(shifts){return shifts.map((v,i)=>v?shiftNames[i]:'').filter(Boolean).join('、')||'整天不可排';}
 function render(){
  body.replaceChildren();if(!person){body.append(el('p','沒有已啟用的員工。'));return;}
  const controls=el('div');controls.className='wa-controls';const employee=el('select');employee.setAttribute('aria-label','員工');data.employees.forEach(e=>employee.append(new Option(e.name,e.id)));employee.value=person;
  employee.onchange=()=>{const value=employee.value;employee.value=person;const go=()=>{person=value;selectPerson();};dirty?guard(go):go();};
  const m=el('input');m.type='month';m.value=month;m.setAttribute('aria-label','套用月份');m.onchange=()=>{const value=m.value;m.value=month;if(!/^20\d{2}-(0[1-9]|1[0-2])$/.test(value))return;const go=()=>{month=value;load();};dirty?guard(go):go();};
  controls.append(label('員工',employee),label('套用月份',m),btn('重新讀取',()=>dirty?guard(load):load()));body.append(controls);
  if(!draft.configured)body.append(el('p','這個月份尚未設定。以下空白勾選只是草稿，儲存前不會視為不可排。請完成一週設定後再預覽。'));
  body.append(el('p','手機可左右滑動週表。勾選＝可以排班；未勾選＝不可排班。'));
  const scroll=el('div');scroll.className='wa-scroll';const table=el('table'),thead=el('thead'),head=el('tr');head.append(el('th','班別／時間'));weekdays.forEach(d=>head.append(el('th','星期'+d)));thead.append(head);table.append(thead);const tbody=el('tbody');
  for(let s=0;s<3;s++){const tr=el('tr'),title=el('th',shiftNames[s]);title.scope='row';title.append(el('small',times[s]));tr.append(title);for(let d=0;d<7;d++){const td=el('td'),l=el('label'),c=el('input');c.type='checkbox';c.checked=draft.weekly[d][s];c.setAttribute('aria-label','星期'+weekdays[d]+' '+shiftNames[s]+'可排');c.onchange=()=>{draft.weekly[d][s]=c.checked;changed();};l.append(c);td.append(l);tr.append(td);}tbody.append(tr);}table.append(tbody);scroll.append(table);body.append(scroll);
  body.append(el('p','設定套用到當月所有相同星期；可排班不代表一定排到。每次儲存僅影響所選員工與月份。'));
  const exceptions=el('section');exceptions.className='wa-box';exceptions.append(el('h3','特殊日期'),el('p','已設定的特殊日期會保留並優先於每週設定。移除例外後，該日恢復每週設定。'));
  for(const [index,r]of draft.exceptions.entries()){const row=el('div');row.className='wa-row';row.append(el('span',r.date+' · '+summary(r.shifts)),btn('修改 '+r.date,()=>editException(index)),btn('恢復每週設定 '+r.date,()=>{draft.exceptions.splice(index,1);changed();render();}));exceptions.append(row);}
  exceptions.append(btn('＋ 新增例外日期',()=>editException(-1)));body.append(exceptions);
  const footer=el('div');footer.className='wa-footer';footer.append(el('span',(dirty?'尚未儲存：':'目前查看：')+data.employees.find(e=>e.id===person).name+' · '+month),btn('預覽套用整月',makePreview,true));body.append(footer);
  body.append(el('p','本設定會取代該員工當月舊式可排／不可排時段；請假、指定班次、工時上限等其他限制仍須遵守。'));
 }
 function editException(index){
  if(body.querySelector('#wa-exception-editor'))return;const current=draft.exceptions[index],box=el('section');box.id='wa-exception-editor';box.className='wa-box';box.append(el('h3',current?'修改特殊日期':'新增特殊日期'));
  const date=el('input');date.type='date';date.value=current?.date||month+'-01';date.min=month+'-01';date.max=month+'-'+String(new Date(+month.slice(0,4),+month.slice(5),0).getDate()).padStart(2,'0');date.setAttribute('aria-label','特殊日期');box.append(label('日期',date));
  const checked=current?.shifts.slice()||[false,false,false],list=[];for(let i=0;i<3;i++){const l=el('label');l.className='wa-check';const c=el('input');c.type='checkbox';c.checked=checked[i];c.setAttribute('aria-label','例外 '+shiftNames[i]+'可排');l.append(c,el('span',shiftNames[i]+' '+times[i]));list.push(c);box.append(l);}
  box.append(el('p','三班都不勾選，表示整天不能上班。'),btn('加入草稿',()=>{if(!date.value||date.value<date.min||date.value>date.max){status.textContent='請選所選月份內的有效日期。';return;}if(draft.exceptions.some((r,i)=>i!==index&&r.date===date.value)){status.textContent='此日期已存在，請修改既有例外。';return;}const r={date:date.value,shifts:list.map(c=>c.checked)};if(index<0)draft.exceptions.push(r);else draft.exceptions[index]=r;draft.exceptions.sort((a,b)=>a.date.localeCompare(b.date));changed();render();}),btn('取消',()=>box.remove()));body.append(box);box.scrollIntoView({block:'nearest'});date.focus();
 }
 async function makePreview(){if(busy)return;if(body.querySelector('#wa-exception-editor')){status.textContent='請先將特殊日期加入草稿，或取消特殊日期編輯。';return;}lock(true);try{preview=await rpc('preview',{hash:data.hash,month,employeeId:person,weekly:draft.weekly,exceptions:draft.exceptions});showPreview();}catch(e){status.textContent=e.message||'預覽失敗';}finally{lock(false);}}
 function showPreview(){body.replaceChildren();status.textContent='尚未儲存：請核對修改前後，確認後才寫入設定。';body.append(el('h3',preview.draft.name+' · '+month+' · 每週設定'));
  const table=el('table'),head=el('tr');['星期','修改前','修改後'].forEach(t=>head.append(el('th',t)));table.append(head);for(let d=0;d<7;d++){const tr=el('tr'),before=preview.before.weekly.find(r=>r[3]===d+1);['星期'+weekdays[d],before?summary(before.slice(4,7)):'未設定（沿用舊規則）',summary(draft.weekly[d])].forEach(t=>tr.append(el('td',t)));table.append(tr);}const scroll=el('div');scroll.className='wa-scroll';scroll.append(table);body.append(scroll);
  body.append(el('h3','特殊日期修改前後'));const all=[...new Set([...preview.before.exceptions.map(r=>r[0]),...draft.exceptions.map(r=>r.date)])].sort();if(!all.length)body.append(el('p','無特殊日期。'));for(const date of all){const a=preview.before.exceptions.find(r=>r[0]===date),b=draft.exceptions.find(r=>r.date===date);body.append(el('p',date+'：'+(a?summary(a.slice(3,6)):'依每週規則')+' → '+(b?summary(b.shifts):'依每週規則')));}
  if(!draft.weekly.flat().some(Boolean))body.append(el('p','注意：一週三班皆未勾選，除特殊日期外，整個月將不可排班。'));
  body.append(el('p','只儲存可排班規則，正式月班表不會改動。請假、鎖定與其他限制仍會檢查。'),btn('返回修改',()=>{preview=null;render();}),btn('確認儲存設定',save,true));
 }
 async function save(){if(busy||!preview)return;lock(true);status.textContent='正在儲存並讀回核對…';try{await rpc('apply',{token:preview.token,confirmed:true});dirty=false;preview=null;await load();status.textContent='已儲存並讀回核對。正式班表未變動。';}catch(e){preview=null;status.textContent=(e.message||'儲存未確認')+' 請重新讀取確認結果，勿重複送出。';body.replaceChildren(btn('重新讀取',()=>{dirty=false;load();}));}finally{lock(false);}}
 const previous=openWebForm;openWebForm=async function(name){if(!['EmployeeAvailability','RecurringAvailability'].includes(name))return previous(name);if(busy)return;parent=document.getElementById('panel');if(parent.open)parent.close();dialog.showModal();body.replaceChildren();dirty=false;preview=null;await load();};
})();
</script>
