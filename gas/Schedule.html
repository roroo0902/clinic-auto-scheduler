<style>
#schedule-dialog{box-sizing:border-box;width:min(1200px,96vw);max-width:min(1200px,96vw);max-height:92dvh;overflow:auto;background:#f7f6f2;color:#233346;border:1px solid #b4a078;border-radius:16px;padding:24px}#schedule-dialog h2,#schedule-dialog h3{color:#253b50}#schedule-dialog p{color:#43556a}#schedule-dialog::backdrop{background:#071525cc}#schedule-dialog button,#schedule-dialog input,#schedule-dialog select{font:inherit;padding:10px;border:1px solid #9ba9b5;border-radius:7px;background:white;color:#203247}#schedule-dialog input[type=number]{width:90px}#schedule-dialog input[type=month]{width:160px}#schedule-dialog .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}#schedule-dialog .scroll{overflow:auto;max-height:60vh}#schedule-dialog table{border-collapse:separate;border-spacing:0;width:100%;background:white}#schedule-dialog th,#schedule-dialog td{padding:10px;border-right:1px solid #ddd;border-bottom:1px solid #ddd;white-space:nowrap;text-align:center}#schedule-dialog th{color:#253b50;background:#e8edf1;position:sticky;top:0;z-index:1}#schedule-dialog th:first-child,#schedule-dialog td:first-child{position:sticky;left:0;background:#edf0ee;z-index:2;text-align:left}#schedule-dialog th:first-child{z-index:3}#schedule-dialog td[data-shift]:not([data-shift=""]){background:#e2f0e8}#schedule-dialog .calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}#schedule-dialog .day{padding:12px 8px;background:white;border:1px solid #d9e1e6;border-radius:8px;min-height:75px}#schedule-dialog .day strong{display:block;margin-bottom:10px}#schedule-dialog .day small{display:block;color:#566979}#schedule-status{white-space:pre-wrap}#schedule-edit{padding:14px;border:1px solid #bac9c0;margin-top:16px}#schedule-dialog .close{float:right}@media(max-width:600px){#schedule-dialog{padding:15px}#schedule-dialog .calendar{gap:3px}#schedule-dialog .day{padding:6px 3px;font-size:12px;min-height:65px}}
#schedule-dialog #schedule-edit .toolbar input,#schedule-dialog #schedule-edit .toolbar select,#schedule-dialog #schedule-edit .toolbar button{box-sizing:border-box;height:48px;min-height:48px;margin:0;line-height:24px}#schedule-dialog #schedule-edit label{margin:0;line-height:20px}
#schedule-dialog .schedule-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}#schedule-dialog .schedule-summary>div{padding:14px;border:1px solid #bdcbd7;border-radius:8px;background:#e9f0f6}#schedule-dialog .schedule-summary span{display:block;font-size:14px}#schedule-dialog .schedule-summary strong{display:block;font-size:23px;margin-top:6px}@media(max-width:600px){#schedule-dialog .schedule-summary{grid-template-columns:1fr}}
#schedule-dialog .schedule-navigation{align-items:flex-end;gap:12px}#schedule-dialog .schedule-navigation label{display:flex;flex-direction:column;gap:7px;margin:0;line-height:20px}#schedule-dialog .schedule-navigation input,#schedule-dialog .schedule-navigation select,#schedule-dialog .schedule-navigation button{box-sizing:border-box;height:48px;min-height:48px;margin:0;line-height:24px}#schedule-dialog .schedule-navigation input{width:182px}#schedule-dialog .schedule-navigation button[aria-pressed="true"]{background:#253b50;color:#fff}#schedule-dialog .schedule-month-help{margin:0 0 12px;font-size:14px}
#schedule-dialog thead{position:sticky;top:0;z-index:3}#schedule-dialog thead th{position:static}#schedule-dialog thead th:first-child{position:sticky;left:0}#schedule-dialog .weekday-row th{background:#e3edf2;padding:6px 10px;font-weight:normal}#schedule-dialog .weekday-row th.weekend{color:#9a4237}
#schedule-dialog #schedule-employee-field[hidden]{display:none}
#schedule-dialog #schedule-month-trigger{min-width:182px;text-align:left}#schedule-month-picker{width:min(360px,85vw);padding:24px;border:1px solid #9ba9b5;border-radius:16px;background:#f7f6f2;color:#253b50}#schedule-month-picker::backdrop{background:#071525aa}#schedule-month-picker h3{margin:0}#schedule-month-picker p{font-size:14px}#schedule-month-picker .month-wheel-columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}#schedule-month-picker .wheel-caption{text-align:center;font-weight:bold;margin-bottom:8px}#schedule-month-picker .wheel-frame{position:relative;border:1px solid #bdcbd7;border-radius:12px;overflow:hidden;background:white}#schedule-month-picker .wheel-frame:after{content:'';position:absolute;top:80px;left:0;right:0;height:40px;box-sizing:border-box;border-top:1px solid #94afc2;border-bottom:1px solid #94afc2;pointer-events:none}#schedule-month-picker .month-wheel{height:200px;box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;scrollbar-width:none;padding:80px 0;outline-offset:-3px}#schedule-month-picker .month-wheel::-webkit-scrollbar{display:none}#schedule-month-picker .wheel-option{height:40px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;cursor:pointer;color:#81909d;font-size:18px}#schedule-month-picker .wheel-option[aria-selected=true]{background:#e2edf4;color:#203e59;font-weight:bold;font-size:22px}#schedule-month-picker .month-picker-actions{display:flex;justify-content:flex-end;gap:12px}#schedule-dialog #month-picker-apply{background:#253b50;color:white}#month-wheel-value{text-align:center}
</style>
<dialog id="schedule-dialog" aria-labelledby="schedule-title"><button class="close" aria-label="關閉班表">×</button><h2 id="schedule-title">班表</h2><div class="toolbar schedule-navigation"><label for="schedule-month-trigger">選擇月份<button type="button" id="schedule-month-trigger" aria-haspopup="dialog">2026 年 11 月 ▾</button><input type="hidden" id="schedule-month" value="2026-11"></label><label id="schedule-employee-field" hidden>查看員工<select id="schedule-employee"></select></label><button id="schedule-personal">我的班表</button><button id="schedule-all">整體班表</button><button id="schedule-reload">重新讀取</button></div><p id="schedule-month-help" class="schedule-month-help">點選月份，開啟「年份／月份」滾輪；上下滑動後按「套用月份」。</p><p id="schedule-status" role="status"></p><div id="schedule-content"></div><div id="schedule-edit" hidden></div><p>A 早班 08:00–12:00 · B 午班 14:30–18:30 · C 晚班 18:30–21:30<br>「未排班」表示當天尚未安排班別，不代表已核准休假；「本月未提供班次」表示原始 PDF 沒有該員工的班表資料。</p><dialog id="schedule-month-picker" aria-labelledby="month-picker-title"><h3 id="month-picker-title">選擇年份與月份</h3><p>上下滑動滾輪，讓要選的年月停在中央。</p><div class="month-wheel-columns"><div><div class="wheel-caption">年份</div><div class="wheel-frame"><div id="year-wheel" class="month-wheel" role="listbox" tabindex="0" aria-label="年份滾輪"></div></div></div><div><div class="wheel-caption">月份</div><div class="wheel-frame"><div id="month-wheel" class="month-wheel" role="listbox" tabindex="0" aria-label="月份滾輪"></div></div></div></div><p id="month-wheel-value" aria-live="polite"></p><div class="month-picker-actions"><button type="button" id="month-picker-cancel">取消</button><button type="button" id="month-picker-apply">套用月份</button></div></dialog></dialog>
<script>
const scheduleDialog=document.getElementById('schedule-dialog'),scheduleContent=document.getElementById('schedule-content'),scheduleStatus=document.getElementById('schedule-status');
let scheduleEmployeeId='',scheduleView='personal',scheduleData=null,scheduleSequence=0,scheduleSaving=false;
const scheduleEl=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;};
function scheduleMonthLabel(month){return month.slice(0,4)+' 年 '+Number(month.slice(5))+' 月';}
function scheduleRPC(method,arg){return new Promise((resolve,reject)=>{const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);if(method==='read')r.getSchedule(arg);else r.saveScheduleDay(arg);});}
async function openSchedule(view){scheduleView=view||'personal';if(!scheduleDialog.open)scheduleDialog.showModal();await loadSchedule();}
async function loadSchedule(){
 if(scheduleSaving)return;const sequence=++scheduleSequence;scheduleData=null;scheduleContent.replaceChildren();document.getElementById('schedule-edit').hidden=true;scheduleStatus.textContent='正在確認身分並讀取班表…';
 try{const data=await scheduleRPC('read',{month:document.getElementById('schedule-month').value,view:scheduleView,employeeId:scheduleEmployeeId});if(sequence!==scheduleSequence)return;scheduleData=data;renderSchedule(data);}
 catch(e){if(sequence===scheduleSequence)scheduleStatus.textContent=e.message||'讀取失敗，請重試。';}
}
function renderSchedule(data){
 const employeeField=document.getElementById('schedule-employee-field'),employeeSelect=document.getElementById('schedule-employee');employeeField.hidden=!(data.canEdit&&data.view==='personal');employeeSelect.replaceChildren();(data.employeeOptions||[]).forEach(e=>employeeSelect.add(new Option(e.name,e.id)));if(data.view==='personal'){scheduleEmployeeId=data.selectedEmployeeId||'';employeeSelect.value=scheduleEmployeeId;}employeeSelect.disabled=!(data.employeeOptions||[]).length;

 document.getElementById('schedule-month').value=data.month;document.getElementById('schedule-month-trigger').textContent=scheduleMonthLabel(data.month)+' ▾';
 document.getElementById('schedule-personal').setAttribute('aria-pressed',String(data.view==='personal'));document.getElementById('schedule-all').setAttribute('aria-pressed',String(data.view==='all'));
 document.getElementById('schedule-title').textContent=scheduleMonthLabel(data.month)+' · '+(data.view==='personal'?'我的班表':'整體班表');
 const summary=scheduleEl('div');summary.className='schedule-summary';
 [['本月上班天數',data.standard?data.standard.workDays+' 天':'待設定或同步'],['預期上班總時數',data.standard?data.standard.hours+' 小時／人':'待設定或同步'],[data.view==='all'?'班表總時數（全體合計）':'班表總時數',data.employees.reduce((n,e)=>n+e.hours,0)+' 小時']].forEach(([label,value])=>{const card=scheduleEl('div');card.append(scheduleEl('span',label),scheduleEl('strong',value));summary.append(card);});scheduleContent.append(summary);
 scheduleStatus.textContent=data.employees.length?data.employees.length+' 人 · '+data.employees.reduce((n,e)=>n+e.hours,0)+' 小時':'本月尚無班表資料。';
 if(data.view==='personal'&&data.employees.length){const e=data.employees[0];scheduleStatus.textContent=e.name+' · '+e.hours+' 小時 · '+e.workDays+' 個出勤日 · '+e.status;const grid=scheduleEl('div');grid.className='calendar';'日一二三四五六'.split('').forEach(x=>grid.append(scheduleEl('b',x)));const offset=new Date(data.month+'-01T12:00:00').getDay();for(let i=0;i<offset;i++)grid.append(scheduleEl('div'));e.days.forEach((shift,i)=>{const cell=scheduleEl('div');cell.className='day';cell.append(scheduleEl('strong',String(i+1)),scheduleEl('span',shift||'未排班'));for(const s of shift)cell.append(scheduleEl('small',({A:'08:00–12:00',B:'14:30–18:30',C:'18:30–21:30'})[s]));grid.append(cell);});scheduleContent.append(grid);}
 else {const wrap=scheduleEl('div');wrap.className='scroll';const table=scheduleEl('table'),head=scheduleEl('tr');['姓名',...Array.from({length:data.dayCount},(_,i)=>String(i+1)),'已排班天數','預期上班總時數','班表總時數','資料狀態'].forEach(v=>head.append(scheduleEl('th',v)));const thead=scheduleEl('thead'),week=scheduleEl('tr');week.className='weekday-row';week.append(scheduleEl('th','星期'));data.weekdays.forEach(w=>{const cell=scheduleEl('th',w);if(w==='日'||w==='六')cell.className='weekend';week.append(cell);});for(let i=0;i<4;i++)week.append(scheduleEl('th',''));thead.append(head,week);table.append(thead);data.employees.forEach(e=>{const row=scheduleEl('tr');row.append(scheduleEl('td',e.name));e.days.forEach(shift=>{const cell=scheduleEl('td',shift||'—');cell.dataset.shift=shift;row.append(cell);});row.append(scheduleEl('td',e.workDays+' 天'),scheduleEl('td',data.standard?data.standard.hours+' 小時':'待設定或同步'),scheduleEl('td',e.hours+' 小時'),scheduleEl('td',e.status));table.append(row);});wrap.append(table);scheduleContent.append(wrap);}
 if(data.canEdit&&data.employees.length)renderScheduleEditor(data);
}
function renderScheduleEditor(data){
 const box=document.getElementById('schedule-edit');box.hidden=false;box.replaceChildren(scheduleEl('h3','管理者專用：新增或修改員工班別'));
 box.append(scheduleEl('p','① 選擇員工與日期　② 選擇要安排的班別　③ 預覽後確認儲存。'));
 const form=scheduleEl('form');form.className='toolbar';form.style.alignItems='flex-end';
 const person=scheduleEl('select'),day=scheduleEl('input'),shift=scheduleEl('select'),submit=scheduleEl('button','預覽班別變更');
 const field=(title,control)=>{const label=scheduleEl('label',title);label.style.display='flex';label.style.flexDirection='column';label.style.gap='7px';label.append(control);return label;};
 day.type='date';day.min=data.month+'-01';day.max=data.month+'-'+String(data.dayCount).padStart(2,'0');day.value=day.min;day.required=true;
 (data.view==='personal'?data.employeeOptions:data.employees).forEach(e=>person.add(new Option(e.name,e.id)));if(data.view==='personal')person.value=data.selectedEmployeeId;
 const labels={'':'未排班（清除當日班別）',A:'A 早班｜08:00–12:00',B:'B 午班｜14:30–18:30',C:'C 晚班｜18:30–21:30',AB:'AB 早班＋午班',AC:'AC 早班＋晚班',BC:'BC 午班＋晚班',ABC:'ABC 早班＋午班＋晚班'};
 Object.keys(labels).forEach(s=>shift.add(new Option(labels[s],s)));submit.type='submit';
 form.append(field('員工姓名',person),field('日期（年／月／日）',day),field('當日班別',shift),submit);box.append(form);
 const current=scheduleEl('p'),preview=scheduleEl('div');preview.setAttribute('aria-live','polite');box.append(current,preview);
 const selectedDay=()=>day.value.startsWith(data.month+'-')?Number(day.value.slice(8)):NaN;
 const showCurrent=()=>{preview.replaceChildren();const e=data.employees.find(x=>x.id===person.value),n=selectedDay();if(!Number.isInteger(n)||n<1||n>data.dayCount){current.textContent='請選擇本月份內的日期。';return;}shift.value=e.days[n-1];current.textContent=e.name+' · '+day.value+' · 目前班別：'+(e.days[n-1]?labels[e.days[n-1]]:'未排班');};
 person.onchange=()=>{if(data.view==='personal'){scheduleEmployeeId=person.value;loadSchedule();}else showCurrent();};day.onchange=showCurrent;shift.onchange=()=>preview.replaceChildren();showCurrent();
 form.addEventListener('submit',event=>{event.preventDefault();preview.replaceChildren();const e=data.employees.find(x=>x.id===person.value),n=selectedDay();if(!Number.isInteger(n)||n<1||n>data.dayCount)return;const input={month:data.month,employeeId:e.id,day:n,before:e.days[n-1],shift:shift.value};
 preview.append(scheduleEl('p','尚未儲存：'+e.name+' · '+day.value+'，將由「'+(input.before?labels[input.before]:'未排班')+'」改為「'+labels[input.shift]+'」。'));
 const confirm=scheduleEl('button','確認儲存班別');confirm.type='button';preview.append(confirm);
 confirm.addEventListener('click',async()=>{if(scheduleSaving)return;scheduleSaving=true;[person,day,shift,confirm,submit].forEach(c=>c.disabled=true);scheduleStatus.textContent='正在儲存並核對班別…';try{await scheduleRPC('write',input);scheduleSaving=false;await loadSchedule();scheduleStatus.textContent+=' · 班別已儲存並核對';}catch(error){scheduleStatus.textContent=error.message||'儲存失敗';}finally{scheduleSaving=false;[person,day,shift,confirm,submit].forEach(c=>c.disabled=false);}});
 });
}
document.getElementById('schedule-personal').onclick=()=>openSchedule('personal');document.getElementById('schedule-all').onclick=()=>openSchedule('all');document.getElementById('schedule-reload').onclick=loadSchedule;document.getElementById('schedule-month').onchange=()=>{scheduleEmployeeId='';loadSchedule();};document.getElementById('schedule-employee').onchange=event=>{if(scheduleSaving)return;scheduleEmployeeId=event.target.value;loadSchedule();};
const monthPicker=document.getElementById('schedule-month-picker');
let monthWheelYear=2026,monthWheelMonth=11;
function buildMonthWheel(id,values,selected,suffix,onSelect){
 const wheel=document.getElementById(id);wheel.replaceChildren();
 values.forEach(value=>{const option=scheduleEl('div',value+suffix);option.className='wheel-option';option.id=id+'-'+value;option.setAttribute('role','option');option.setAttribute('aria-selected',String(value===selected));option.onclick=()=>wheel.scrollTo({top:values.indexOf(value)*40,behavior:'smooth'});wheel.append(option);});
 const update=()=>{const index=Math.max(0,Math.min(values.length-1,Math.round(wheel.scrollTop/40)));Array.from(wheel.children).forEach((e,i)=>e.setAttribute('aria-selected',String(i===index)));wheel.setAttribute('aria-activedescendant',id+'-'+values[index]);onSelect(values[index]);document.getElementById('month-wheel-value').textContent=monthWheelYear+' 年 '+monthWheelMonth+' 月';};
 wheel.onscroll=update;wheel.onkeydown=event=>{if(!['ArrowUp','ArrowDown','Home','End'].includes(event.key))return;event.preventDefault();const current=Math.round(wheel.scrollTop/40),index=event.key==='Home'?0:event.key==='End'?values.length-1:current+(event.key==='ArrowUp'?-1:1);wheel.scrollTo({top:Math.max(0,Math.min(values.length-1,index))*40,behavior:'instant'});update();};wheel.scrollTop=values.indexOf(selected)*40;update();
}
document.getElementById('schedule-month-trigger').onclick=()=>{if(scheduleSaving)return;const parts=document.getElementById('schedule-month').value.split('-').map(Number);monthWheelYear=parts[0];monthWheelMonth=parts[1];monthPicker.showModal();buildMonthWheel('year-wheel',Array.from({length:21},(_,i)=>parts[0]-10+i),parts[0],' 年',v=>monthWheelYear=v);buildMonthWheel('month-wheel',Array.from({length:12},(_,i)=>i+1),parts[1],' 月',v=>monthWheelMonth=v);};
document.getElementById('month-picker-cancel').onclick=()=>monthPicker.close();monthPicker.addEventListener('cancel',e=>e.stopPropagation());
document.getElementById('month-picker-apply').onclick=()=>{const value=monthWheelYear+'-'+String(monthWheelMonth).padStart(2,'0');monthPicker.close();document.getElementById('schedule-month').value=value;document.getElementById('schedule-month-trigger').textContent=scheduleMonthLabel(value)+' ▾';scheduleEmployeeId='';loadSchedule();};
scheduleDialog.querySelector('.close').onclick=()=>{if(!scheduleSaving){scheduleSequence++;scheduleDialog.close();}};scheduleDialog.addEventListener('cancel',e=>{if(scheduleSaving)e.preventDefault();else scheduleSequence++;});
document.querySelectorAll('[data-schedule]').forEach(b=>b.onclick=()=>openSchedule(b.dataset.schedule));
</script>
