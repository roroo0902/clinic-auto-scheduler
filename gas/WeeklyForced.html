<style>
#wf-dialog{width:min(1220px,96vw);max-width:1220px;max-height:94dvh;box-sizing:border-box;overflow:auto;padding:0;border:0;border-radius:20px;background:#f5f6f7;color:#203858;font:16px/1.6 system-ui,sans-serif}#wf-dialog p,#wf-dialog td,#wf-dialog th,#wf-dialog label,#wf-dialog summary{color:#203858}#wf-dialog .wf-header p{color:#eef5ff}#wf-dialog::backdrop{background:#101c32bf}#wf-dialog *{box-sizing:border-box}#wf-dialog .wf-header{padding:18px 24px;background:#203e64;color:white;display:flex;gap:16px;align-items:center;flex-wrap:wrap}#wf-dialog h2{margin:0;color:inherit;font:700 26px/1.4 system-ui}#wf-dialog h3{margin:0 0 12px;font:700 21px/1.5 system-ui;color:#203858}#wf-dialog button,#wf-dialog select,#wf-dialog input{font:inherit;border:1px solid #bdcad7;border-radius:10px;min-height:44px;padding:8px 12px;background:white;color:#203858}#wf-dialog button{cursor:pointer}#wf-dialog button:disabled{opacity:.5;cursor:wait}#wf-dialog button:focus-visible,#wf-dialog select:focus-visible,#wf-dialog input:focus-visible{outline:3px solid #00879a;outline-offset:2px}#wf-dialog .wf-primary{background:#00869a;color:white;border-color:#00869a;font-weight:700}#wf-dialog .wf-header button{background:transparent;color:white;border-color:#9cb7cf}#wf-dialog .wf-header #wf-close{margin-left:auto}#wf-body{padding:0 22px 22px}#wf-status{padding:12px 24px;margin:0;white-space:pre-wrap}#wf-dialog .wf-card{background:white;border-radius:16px;padding:20px;margin:0 0 18px;box-shadow:0 3px 16px #1c39500a}#wf-dialog .wf-scroll{overflow:auto;max-height:52vh;border:1px solid #dbe3eb;border-radius:12px}#wf-dialog table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;font-size:15px}#wf-dialog th,#wf-dialog td{border-right:1px solid #e0e6ee;border-bottom:1px solid #e0e6ee;padding:10px;text-align:center;white-space:nowrap}#wf-dialog thead th{position:sticky;top:0;background:#edf2f7;z-index:2}#wf-dialog th:first-child{position:sticky;left:0;background:#f7f9fc;z-index:1}#wf-dialog thead th:first-child{z-index:3}#wf-dialog td select{width:100%;min-width:100px;border:1px solid transparent;font-weight:600}#wf-dialog select[data-value=A]{background:#dfedff;color:#145894}#wf-dialog select[data-value=B]{background:#fff0cf;color:#925500}#wf-dialog select[data-value=C]{background:#eee3ff;color:#66359a}#wf-dialog select[data-value=AB],#wf-dialog select[data-value=AC],#wf-dialog select[data-value=BC],#wf-dialog select[data-value=ABC]{background:#dff2ef;color:#006a73}#wf-dialog select[data-value=OFF],#wf-dialog select[data-value=UNSET]{background:#f0f1f4;color:#525d70}#wf-dialog .wf-controls,#wf-dialog .wf-actions,#wf-dialog .wf-exception{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}#wf-dialog label{display:grid;gap:5px}#wf-dialog .wf-note{font-size:14px;color:#596c84}#wf-dialog details{border:1px solid #dbe3eb;border-radius:10px;padding:12px;margin-top:16px}#wf-dialog summary{cursor:pointer;font-weight:700}#wf-dialog .wf-actions{justify-content:flex-end}#wf-dialog .wf-warning{padding:12px;background:#fff4dd;border-radius:10px;color:#7a4d00}#wf-dialog .wf-exception{padding:10px 0;border-bottom:1px solid #e0e6ee}#wf-dialog .wf-exception span{flex:1;min-width:180px}#wf-dialog .wf-month-table{min-width:850px}#wf-dialog .wf-month-table th,#wf-dialog .wf-month-table td{min-width:80px;padding:8px}#wf-dialog .wf-guard{border:2px solid #c08b2a;padding:12px;border-radius:12px;background:#fff4dd}@media(max-width:650px){#wf-dialog{width:98vw;max-height:96dvh;border-radius:12px}#wf-body{padding:0 10px 12px}#wf-dialog .wf-card{padding:14px}#wf-dialog .wf-header{padding:14px;gap:8px}#wf-dialog h2{font-size:21px}#wf-dialog .wf-header p{width:100%;margin:0}#wf-dialog .wf-header #wf-close{margin-left:auto}#wf-status{padding:10px 14px}#wf-dialog .wf-actions button{flex:1}#wf-dialog .wf-controls label{flex:1;min-width:145px}}
</style>
<dialog id="wf-dialog" aria-labelledby="wf-title"><header class="wf-header"><button id="wf-back" type="button">‹ 上一頁</button><h2 id="wf-title">每週指定班別</h2><p>設定一週，其他週自動沿用</p><button id="wf-close" type="button" aria-label="關閉每週指定班別">×</button></header><p id="wf-status" role="status"></p><div id="wf-body"></div></dialog>
<script>
(()=>{
 const dialog=document.getElementById('wf-dialog'),body=document.getElementById('wf-body'),status=document.getElementById('wf-status');
 const names={UNSET:'未指定',OFF:'休',A:'早班',B:'午班',C:'晚班',AB:'早＋午',AC:'早＋晚',BC:'午＋晚',ABC:'早＋午＋晚',INHERIT:'沿用每週'},days=['一','二','三','四','五','六','日'];
 let data=null,draft=null,preview=null,busy=false,dirty=false,parent=null;
 const el=(t,s)=>{const e=document.createElement(t);if(s!==undefined)e.textContent=s;return e;};
 const button=(text,fn,primary)=>{const b=el('button',text);b.type='button';b.onclick=fn;if(primary)b.className='wf-primary';return b;};
 const label=(text,input)=>{const l=el('label');l.append(el('span',text),input);return l;};
 const rpc=(method,input)=>new Promise((resolve,reject)=>{const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);if(method==='read')r.getWeeklyForced(input);else if(method==='preview')r.previewWeeklyForced(input);else r.applyWeeklyForced(input);});
 function lock(value){busy=value;dialog.querySelectorAll('button,input,select').forEach(e=>e.disabled=value);}
 function changed(){dirty=true;preview=null;status.textContent='尚未儲存。請先預覽套用結果。';}
 function picker(value,aria,change,inherit=false){const s=el('select');s.setAttribute('aria-label',aria);for(const [v,text]of Object.entries(names))if(v!=='INHERIT'||inherit)s.append(new Option(text,v));s.value=value;s.dataset.value=value;s.onchange=()=>{s.dataset.value=s.value;change(s.value);};return s;}
 function guard(fn){if(body.querySelector('.wf-guard'))return;const box=el('section');box.className='wf-guard';box.setAttribute('role','alert');box.append(el('p','還有未儲存的修改，要捨棄嗎？'),button('繼續編輯',()=>box.remove()),button('捨棄修改',()=>{dirty=false;box.remove();fn();}));body.prepend(box);box.querySelector('button').focus();}
 function leave(){if(busy)return;if(preview){preview=null;render();return;}const close=()=>{dialog.close();if(parent&&!parent.open)parent.showModal();};dirty?guard(close):close();}
 document.getElementById('wf-back').onclick=leave;document.getElementById('wf-close').onclick=leave;dialog.addEventListener('cancel',e=>{e.preventDefault();leave();});window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue='';}});
 async function load(input={}){lock(true);status.textContent='正在讀取每週範本與特殊日期…';try{data=await rpc('read',input);draft={date:data.date,month:data.month,weekly:data.weekly.map(r=>({employeeId:r.employeeId,value:r.value.slice()})),exceptions:[]};preview=null;dirty=false;render();status.textContent='選擇每位員工星期一至日的班別；特殊日期優先。';}catch(e){status.textContent=e.message||'讀取失敗';body.replaceChildren(button('重新讀取',()=>load(input)));}finally{lock(false);}}
 function exceptionList(){const map=new Map();for(const r of data.legacy){if(r.date?.startsWith(draft.month+'-')){const key=r.employeeId+'|'+r.date,old=map.get(key);map.set(key,{employeeId:r.employeeId,date:r.date,value:[...new Set((old?.value||'')+r.shiftId)].sort().join(''),legacy:true});}}for(const r of data.entries)if(r.type==='exception'&&r.date.startsWith(draft.month+'-'))map.set(r.employeeId+'|'+r.date,r);for(const r of draft.exceptions)if(r.date.startsWith(draft.month+'-'))map.set(r.employeeId+'|'+r.date,r);return [...map.values()].sort((a,b)=>a.date.localeCompare(b.date));}
 function render(){
  body.replaceChildren();if(!data.employees.length){body.append(el('p','目前沒有啟用員工。'));return;}
  const card=el('section');card.className='wf-card';card.append(el('h3','① 設定每週範本'),el('p','點選格子即可選擇班別。手機可左右滑動週表。'));
  const scroll=el('div');scroll.className='wf-scroll';const table=el('table'),thead=el('thead'),head=el('tr');head.append(el('th','員工'));days.forEach(d=>head.append(el('th','週'+d)));thead.append(head);table.append(thead);const tbody=el('tbody');
  for(const employee of data.employees){const r=draft.weekly.find(r=>r.employeeId===employee.id),tr=el('tr'),th=el('th',employee.name);th.scope='row';tr.append(th);r.value.forEach((value,i)=>{const td=el('td');td.append(picker(value,employee.name+' 週'+days[i],v=>{r.value[i]=v;changed();}));tr.append(td);});tbody.append(tr);}table.append(tbody);scroll.append(table);card.append(scroll);const note=el('p','休＝當天不排班　｜　未指定＝交給系統安排　｜　早班＝只排早班');note.className='wf-note';card.append(note);body.append(card);
  const apply=el('section');apply.className='wf-card';apply.append(el('h3','② 套用到其他週'));const controls=el('div');controls.className='wf-controls';const date=el('input');date.type='date';date.min=data.today;date.value=draft.date;date.setAttribute('aria-label','生效日期');date.onchange=()=>{draft.date=date.value;changed();};const month=el('input');month.type='month';month.value=draft.month;month.setAttribute('aria-label','預覽月份');month.onchange=()=>{draft.month=month.value;changed();render();};controls.append(label('生效日期',date),label('預覽月份',month));apply.append(controls,el('p','從生效日起，其他週及之後月份依星期沿用；特殊日期可個別調整。'));
  const details=el('details');details.open=draft.exceptions.length>0;details.append(el('summary','特殊日期調整'));const help=el('p','原本的指定日期會保留。選「沿用每週」可取消當日例外；選「未指定」則交給系統安排。');help.className='wf-note';details.append(help);
  for(const r of exceptionList()){const row=el('div');row.className='wf-exception';const name=data.employees.find(e=>e.id===r.employeeId)?.name||r.employeeId;row.append(el('span',r.date+'　'+name+'：'+(names[r.value]||r.value)+(r.legacy?'（原指定：至少包含）':'')));if(r.date>=data.today&&data.employees.some(e=>e.id===r.employeeId))row.append(button('調整',()=>editException(r)),button('沿用每週',()=>putException({...r,value:'INHERIT'})));details.append(row);}details.append(button('＋ 新增調整',()=>editException()));apply.append(details);body.append(apply);
  const actions=el('div');actions.className='wf-actions';actions.append(button('重新讀取',()=>dirty?guard(()=>load({date:draft.date,month:draft.month})):load({date:draft.date,month:draft.month})),button('預覽月班表',makePreview,true));body.append(actions);const foot=el('p','只設定排班規則，不會直接更動已發布班表。請假、可排時段、允許班別與工時限制仍需符合。');foot.className='wf-note';body.append(foot);
 }
 function putException(r){draft.exceptions=draft.exceptions.filter(x=>!(x.employeeId===r.employeeId&&x.date===r.date));draft.exceptions.push({employeeId:r.employeeId,date:r.date,value:r.value});changed();render();}
 function editException(r){
  if(body.querySelector('#wf-edit'))return;const box=el('section');box.id='wf-edit';box.className='wf-card';box.append(el('h3','特殊日期調整'));const employee=el('select');employee.setAttribute('aria-label','特殊日期員工');data.employees.forEach(e=>employee.append(new Option(e.name,e.id)));employee.value=r?.employeeId||data.employees[0].id;
  const date=el('input');date.type='date';date.min=data.today;date.value=r?.date||(draft.month===data.today.slice(0,7)?data.today:draft.month+'-01');date.setAttribute('aria-label','特殊日期');if(r){employee.disabled=true;date.disabled=true;}
  const choice=picker(r?.value||'INHERIT','特殊日期班別',()=>{},true);const controls=el('div');controls.className='wf-controls';controls.append(label('員工',employee),label('日期',date),label('班別',choice));box.append(controls,button('取消',()=>box.remove()),button('加入調整',()=>{if(!date.value||date.value<data.today){status.textContent='請選今天或之後的日期。';return;}draft.month=date.value.slice(0,7);putException({employeeId:employee.value,date:date.value,value:choice.value});},true));body.prepend(box);box.scrollIntoView({block:'nearest'});
 }
 async function makePreview(){if(busy)return;lock(true);status.textContent='正在展開整月設定並檢查衝突…';try{preview=await rpc('preview',{hash:data.hash,...draft});renderPreview();status.textContent='尚未儲存，請核對下方套用結果。';}catch(e){status.textContent=e.message||'預覽失敗';}finally{lock(false);}}
 function renderPreview(){
  body.replaceChildren();const card=el('section');card.className='wf-card';card.append(el('h3',draft.month+' 套用預覽'),el('p',preview.message));if(preview.future.length)card.append(el('p','已有後續範本版本：'+preview.future.join('、')+'，到該日將沿用後續版本。'));
  const scroll=el('div');scroll.className='wf-scroll';const table=el('table');table.className='wf-month-table';const thead=el('thead'),head=el('tr');head.append(el('th','員工'));for(const d of preview.coverage[0]?.days||[])head.append(el('th',d.date.slice(8)+'（'+days[(new Date(d.date+'T00:00:00Z').getUTCDay()||7)-1]+'）'));thead.append(head);table.append(thead);const tb=el('tbody');for(const e of preview.coverage){const tr=el('tr');tr.append(el('th',e.name));for(const d of e.days){const td=el('td',(names[d.value]||d.value)+(d.legacy?'＊':d.source==='特殊日期'?'●':''));td.title=d.date+' '+d.source;tr.append(td);}tb.append(tr);}table.append(tb);scroll.append(table);card.append(scroll,el('p','● 特殊日期　＊ 原指定日期（至少包含）　｜　這是規則預覽，並非已完成排班。'));body.append(card);
  if(preview.conflicts.length||preview.inputIssues.length){const warning=el('details');warning.className='wf-warning';warning.open=preview.conflicts.length>0;warning.append(el('summary','排班檢查提醒（'+(preview.conflicts.length+preview.inputIssues.length)+'）'),el('p','可先儲存設定；正式自動排班仍須通過全部限制檢查。'));for(const s of [...preview.conflicts,...preview.inputIssues].slice(0,60))warning.append(el('p',s));body.append(warning);}
  const actions=el('div');actions.className='wf-actions';actions.append(button('返回修改',()=>{preview=null;render();}),button('儲存並套用',save,true));body.append(actions);
 }
 async function save(){if(busy||!preview)return;lock(true);status.textContent='正在儲存並讀回核對…';try{await rpc('save',{token:preview.token,confirmed:true});dirty=false;preview=null;await load({date:draft.date,month:draft.month});status.textContent='已儲存並讀回核對。其他週依此範本沿用；已發布班表未變動。';}catch(e){preview=null;status.textContent=(e.message||'儲存未確認')+' 請重新讀取確認，勿重複送出。';body.replaceChildren(button('重新讀取',()=>load({date:draft.date,month:draft.month})));}finally{lock(false);}}
 const previous=openWebForm;openWebForm=async function(name){if(name!=='ForcedShifts')return previous(name);if(busy)return;parent=document.getElementById('panel');if(parent?.open)parent.close();dialog.showModal();body.replaceChildren();dirty=false;preview=null;await load();};
})();
</script>
